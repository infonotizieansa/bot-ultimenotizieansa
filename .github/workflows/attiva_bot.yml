name: Bot Ultime Notizie ANSA

on:
  schedule:
    - cron: '*/25 7-22 * * *'
    - cron: '0 23,1,3,5 * * *'
  workflow_dispatch:

jobs:
  attiva-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama il file PHP su TopHost (3 tentativi mascherati)
        run: |
          URL="https://www.risparmitop.it/bot_ultimenotizieansa.php"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          MAX_TIME=120
          SUCCESS=false

          echo "🚀 Avvio procedura con 3 tentativi mascherati da browser..."

          for i in 1 2 3; do
            echo "🔄 Tentativo $i di 3 in corso..."
            
            # Eseguiamo curl simulando un browser Chrome italiano
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time $MAX_TIME \
              -A "$USER_AGENT" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
              -H "Accept-Language: it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7" \
              -H "Connection: keep-alive" \
              "$URL")
            
            echo "📡 Risposta ricevuta da TopHost: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Tentativo $i riuscito con successo!"
              SUCCESS=true
              break
            else
              echo "⚠️ Tentativo $i fallito (TopHost ha risposto con HTTP $HTTP_CODE)."
              if [ $i -lt 3 ]; then
                WAIT=$((i * 20)) # Aspetta 20s, poi 40s
                echo "⏳ Attendo $WAIT secondi prima del prossimo tentativo..."
                sleep $WAIT
              fi
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Errore critico: Tutti e 3 i tentativi sono falliti."
            exit 1
          fi
