name: Bot Ultime Notizie ANSA

on:
  schedule:
    # Giorno (07:00 - 22:59): ogni 25 minuti
    - cron: '*/25 7-22 * * *'
    # Notte (23:00 - 06:59): ogni 120 minuti (2 ore)
    - cron: '0 23,1,3,5 * * *'
  workflow_dispatch:

jobs:
  attiva-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama il file PHP su TopHost
        run: |
          curl -s -o /dev/null "https://www.risparmitop.it/bot_ultimenotizieansa.php"
