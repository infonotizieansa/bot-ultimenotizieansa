name: Bot Ultime Notizie ANSA

on:
  schedule:
    - cron: '*/25 7-22 * * *'
    - cron: '0 23,1,3,5 * * *'
  workflow_dispatch:

jobs:
  attiva-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama il file PHP su TopHost (3 tentativi)
        run: |
          MAX_TIME=180
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          URL="https://www.risparmitop.it/bot_ultimenotizieansa.php"
          SUCCESS=0
          
          # Tentativo 1
          echo "🔄 Tentativo 1..."
          if curl --max-time $MAX_TIME -s -o /dev/null -A "$USER_AGENT" "$URL"; then
            echo "✅ Tentativo 1 riuscito"
            SUCCESS=1
          else
            echo "⚠️ Tentativo 1 fallito, attendo 15 secondi..."
            sleep 15
          fi
          
          # Tentativo 2
          if [ $SUCCESS -eq 0 ]; then
            echo "🔄 Tentativo 2..."
            if curl --max-time $MAX_TIME -s -o /dev/null -A "$USER_AGENT" "$URL"; then
              echo "✅ Tentativo 2 riuscito"
              SUCCESS=1
            else
              echo "⚠️ Tentativo 2 fallito, attendo 30 secondi..."
              sleep 30
            fi
          fi
          
          # Tentativo 3
          if [ $SUCCESS -eq 0 ]; then
            echo "🔄 Tentativo 3..."
            if curl --max-time $MAX_TIME -s -o /dev/null -A "$USER_AGENT" "$URL"; then
              echo "✅ Tentativo 3 riuscito"
              SUCCESS=1
            else
              echo "❌ Tutti e 3 i tentativi falliti"
              exit 1
            fi
          fi
          
          echo "🎉 Bot ANSA completato con successo"
